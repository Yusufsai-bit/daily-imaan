kind = "mobile"
previewPath = "/"
title = "Daily Imaan"
version = "1.0.0"
id = "artifacts/daily-imaan"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 24438

[services.development]
run = "pnpm --filter @workspace/daily-imaan run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/daily-imaan", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/daily-imaan", "run", "serve" ]

[services.env]
PORT = "24438"
BASE_PATH = "/"
