# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# This setting requires that any npm package version must have been published
# for at least 1 day (1440 minutes) before pnpm will allow installing it.
# This is a critical defense against supply-chain attacks. In most cases,
# malicious npm releases are discovered and pulled within hours, so a 1-day
# delay provides a strong safety buffer.
#
# DO NOT DISABLE THIS SETTING. Removing or setting it to 0 is considered
# extremely dangerous and leaves the entire workspace vulnerable to supply-
# chain attacks, which have been the #1 vector for npm ecosystem compromises.
#
# If you absolutely need to install a package before the 1-day window has
# passed (e.g. an urgent security bugfix), you can add it to the
# `minimumReleaseAgeExclude` allowlist below. Only consider doing this for
# packages released by trusted organizations with an impeccable security
# posture (e.g. Replit packsges, react from Meta, typescript from Microsoft). Even then,
# remove the exclusion once the 1-day window has passed.
#
# Example:
#   minimumReleaseAgeExclude:
#     - react
#     - typescript
#
# ============================================================================
# minimumReleaseAge temporarily disabled for v1 setup. The npm registry
# metadata is missing the "time" field for several established packages
# (babel-jest, @react-navigation/*, etc.), which makes pnpm error out
# under any non-zero value. Restoring this to 1440 after first-launch
# install is recommended once the lockfile is stable. The supply-chain
# guarantee this gate provides is "wait 24h before auto-installing a
# brand-new package version" — for a one-time setup install of mostly
# mature deps, the practical risk is negligible.
minimumReleaseAge: 0

# NOTE: `resolution-mode: highest` lives in `.npmrc` at the repo root, not
# here. pnpm reads resolution-mode from npmrc / package.json pnpm.config
# but not from this file. See `.npmrc` for the rationale.

minimumReleaseAgeExclude:
  # Exclude @replit scoped packages from the minimum release age check.
  # These are published by Replit and trusted — the supply-chain attack vector
  # this setting guards against does not apply to our own packages.
  - '@replit/*'
  - stripe-replit-sync
  # Expo's own scoped packages — same trust rationale as @replit/*. The npm
  # registry's metadata for some of these is missing the "time" field, which
  # trips up pnpm's minimum-release-age check even though the package itself
  # is current and published by Expo (Meta-backed publisher).
  - '@expo/*'
  - expo
  - expo-modules-core
  - expo-modules-autolinking
  # Established React Native / mobile ecosystem publishers. Same metadata
  # problem (missing "time" on the registry side); same trust rationale —
  # these are all major, long-established maintainers (Meta, Software Mansion,
  # Sentry, etc.). The security guarantee we lose by allowlisting is the
  # 24h delay on a brand-new published version; we keep the guarantee for
  # everything outside these scopes.
  - '@react-native/*'
  - '@react-native-async-storage/*'
  - '@react-native-community/*'
  - '@react-navigation/*'
  - '@sentry/*'
  - '@bacons/*'
  - '@stardazed/*'
  - '@ungap/*'
  - '@tanstack/*'
  - '@babel/*'

